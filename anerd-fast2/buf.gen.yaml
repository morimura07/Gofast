version: v2
plugins:
  # - remote: buf.build/protocolbuffers/go
  - local: protoc-gen-go
    out: app/gen
    opt: paths=source_relative
  # - remote: buf.build/connectrpc/go
  - local: protoc-gen-connect-go
    out: app/gen
    opt: paths=source_relative
  # - remote: buf.build/bufbuild/es:v2.7.0
  - local: protoc-gen-es
    out: app/service-client/src/lib/gen
    opt: target=ts
