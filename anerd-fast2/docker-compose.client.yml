services:
  client:
    container_name: anerd-fast2-client
    build:
      context: ./app
      dockerfile: ./service-client/Dockerfile
      target: dev
    volumes:
      - ./app/service-client/src:/app/service-client/src
      - ./app/service-client/.svelte-kit:/app/service-client/.svelte-kit
    ports:
      - 3000:3000
    environment:
      LOG_LEVEL: debug
      PUBLIC_CORE_URL: http://localhost:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 5
