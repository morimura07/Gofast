name: Lint Go

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
      paths:
        required: false
        type: string
        default: "./..."

jobs:
  lint-go:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ inputs.directory }}
          args: ${{ inputs.paths }}
