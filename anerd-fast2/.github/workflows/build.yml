name: Build

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string
      pr_number:
        required: false
        type: string
    outputs:
      image_tag:
        description: "The full image tag that was built and pushed."
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment: ${{ (inputs.pr_number != '' && 'staging') || (github.event.release.prerelease == true && 'staging' || 'production') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ inputs.pr_number && steps.meta.outputs.tags || format('{0}/{1}/{2}:{3}', inputs.registry, github.repository, inputs.image_name, steps.meta.outputs.version) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ github.repository }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=sha,enable=${{ inputs.pr_number == '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write secret files
        run: |
          echo "${{ secrets.PRIVATE_KEY_PEM }}" > private.pem
          echo "${{ secrets.PUBLIC_KEY_PEM }}" > public.pem
          echo "✅ Secret files created"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORE_URL=${{ inputs.pr_number != '' && format('https://pr-{0}-core.{1}', inputs.pr_number, vars.DOMAIN) || vars.CORE_URL }}
            CLIENT_URL=${{ inputs.pr_number != '' && format('https://pr-{0}-{1}.{2}.workers.dev', inputs.pr_number, vars.CONTEXT, vars.WORKERS_SUBDOMAIN) || vars.CLIENT_URL }}
          secret-files: |
            privatekey=private.pem
            publickey=public.pem
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up secret files
        run: |
          rm -f private.pem public.pem
          echo "✅ Secret files removed"
