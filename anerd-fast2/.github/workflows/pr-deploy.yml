name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend Image
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      registry: ghcr.io
      image_name: service-core
      context: app
      dockerfile: app/service-core/Dockerfile
      pr_number: ${{ github.event.pull_request.number }}

  deploy-backend:
    name: Deploy Backend to K8s
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      packages: read
    outputs:
      postgres-password: ${{ steps.pg-password.outputs.password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Generate PostgreSQL Password
        id: pg-password
        run: |
          # Check if secret already exists and reuse the password
          if kubectl get secret postgres-credentials -n pr-${{ github.event.pull_request.number }} 2>/dev/null; then
            echo "Reusing existing PostgreSQL password"
            PG_PASS=$(kubectl get secret postgres-credentials -n pr-${{ github.event.pull_request.number }} -o jsonpath='{.data.password}' | base64 -d)
          else
            echo "Generating new PostgreSQL password"
            PG_PASS=$(openssl rand -hex 32)
          fi
          echo "::add-mask::$PG_PASS"
          echo "password=$PG_PASS" >> $GITHUB_OUTPUT

      - name: Deploy Namespace
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          envsubst < infra/pr-environment/namespace.yaml | kubectl apply -f -

      - name: Deploy Docker Registry Secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=pr-${{ github.event.pull_request.number }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Other Secrets
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          export POSTGRES_PASSWORD='${{ steps.pg-password.outputs.password }}'
          export GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}'
          export GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'
          envsubst < infra/pr-environment/secrets.yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          envsubst < infra/pr-environment/postgres.yaml | kubectl apply -f -

      - name: Wait for PostgreSQL Ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres -n pr-${{ github.event.pull_request.number }} --timeout=120s

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache Goose binary
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-goose

      - name: Setup Goose
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Port Forward PostgreSQL
        run: |
          kubectl port-forward -n pr-${{ github.event.pull_request.number }} svc/postgres 5432:5432 &
          PF_PID=$!
          echo "PORT_FORWARD_PID=$PF_PID" >> $GITHUB_ENV
          echo "Waiting for port-forward to be ready..."
          sleep 5

      - name: Run Migrations
        run: |
          goose -dir ./app/service-core/storage/migrations postgres "user=pruser password=${{ steps.pg-password.outputs.password }} host=127.0.0.1 port=5432 dbname=pr_${{ github.event.pull_request.number }}_db sslmode=disable" up

      - name: Cleanup Port Forward
        if: always()
        run: |
          if [ -n "$PORT_FORWARD_PID" ]; then
            kill $PORT_FORWARD_PID || true
          fi

      - name: Deploy Service Core
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          export IMAGE_TAG=${{ needs.build-backend.outputs.image_tag }}
          export DOMAIN=${{ vars.DOMAIN }}
          export CONTEXT=${{ vars.CONTEXT }}
          export WORKERS_SUBDOMAIN=${{ vars.WORKERS_SUBDOMAIN }}
          envsubst < infra/pr-environment/service-core.yaml | kubectl apply -f -

      - name: Create Self-Signed Certificate for PR
        run: |
          PR_HOST="pr-${{ github.event.pull_request.number }}-core.${{ vars.DOMAIN }}"
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout tls.key -out tls.crt \
            -subj "/CN=${PR_HOST}/O=PR Preview" \
            -addext "subjectAltName=DNS:${PR_HOST}"
          kubectl create secret tls pr-tls-cert \
            --cert=tls.crt --key=tls.key \
            --namespace=pr-${{ github.event.pull_request.number }} \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f tls.key tls.crt

      - name: Deploy Ingress
        run: |
          export PR_NUMBER=${{ github.event.pull_request.number }}
          export DOMAIN=${{ vars.DOMAIN }}
          envsubst < infra/pr-environment/ingress.yaml | kubectl apply -f -

      - name: Wait for Service Core Ready
        run: |
          echo "Waiting for service-core to be ready..."
          kubectl wait --for=condition=ready pod -l app=service-core -n pr-${{ github.event.pull_request.number }} --timeout=120s

  deploy-client:
    name: Deploy Client to Cloudflare
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    needs: deploy-backend
    uses: ./.github/workflows/deploy-client.yml
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}

  comment:
    name: Comment PR with Preview URLs
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    needs: [deploy-backend, deploy-client]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      pull-requests: write

    steps:
      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const domain = '${{ vars.DOMAIN }}';
            const workerName = '${{ vars.CONTEXT }}';
            const workersSubdomain = '${{ vars.WORKERS_SUBDOMAIN }}';
            const backendUrl = `https://pr-${prNumber}-core.${domain}`;
            const clientUrl = `https://pr-${prNumber}-${workerName}.${workersSubdomain}.workers.dev`;

            const comment = `## 🚀 Preview Environment Deployed

            Your PR preview environment is ready!

            - **Frontend**: ${clientUrl}
            - **Backend API**: ${backendUrl}
            - **Health Check**: ${backendUrl}/health

            This environment will be automatically cleaned up when the PR is closed.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Environment Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
