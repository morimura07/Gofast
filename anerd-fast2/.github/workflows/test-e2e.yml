name: E2E Tests

on:
  workflow_call:

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            app/go.sum
            app/service-core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Generate PEM files
        run: make keys

      - name: Create client .env
        run: |
          echo "PUBLIC_CORE_URL=http://localhost:4000" > app/service-client/.env

      - name: Build and start services
        run: docker compose -f docker-compose.yml -f docker-compose.client.yml -f docker-compose.test.yml up -d --build --force-recreate --wait
        env:
          DEV_USER_ID: "00000000-0000-0000-0000-000000000000"
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          OAUTH_REDIRECT_URI: "http://localhost:8080/callback"
          GOOGLE_CLIENT_ID: "dummy-client-id"
          GOOGLE_CLIENT_SECRET: "dummy-client-secret"
          GITHUB_CLIENT_ID: "dummy-client-id"
          GITHUB_CLIENT_SECRET: "dummy-client-secret"
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_BASIC: ${{ vars.STRIPE_PRICE_ID_BASIC }}
          STRIPE_PRICE_ID_PRO: ${{ vars.STRIPE_PRICE_ID_PRO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BUCKET_NAME: ${{ vars.BUCKET_NAME }}

      - name: Cache Goose binary
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-goose

      - name: Setup Goose
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run Migrations
        run: make migrate

      - name: Seed E2E user
        run: ./scripts/seed_dev_user.sh

      - name: Install Stripe CLI
        run: |
          STRIPE_URL=$(curl -s https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -o 'https://github.com/stripe/stripe-cli/releases/download/[^"]*linux_x86_64.tar.gz')
          curl -sL "$STRIPE_URL" | tar xz -C /usr/local/bin

      - name: Start Stripe webhook listener
        run: |
          stripe listen --api-key ${{ secrets.STRIPE_API_KEY }} --latest --forward-to localhost:4000/payments/webhook &
          sleep 3

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers and dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: e2e

      - name: Install Playwright OS dependencies only
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        working-directory: e2e

      - name: Run Playwright tests
        run: npm test
        working-directory: e2e
        timeout-minutes: 10
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Core container logs ==="
          docker logs gofast-core --tail 200
          echo ""
          echo "=== Client container logs ==="
          docker logs gofast-client --tail 50

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.client.yml -f docker-compose.test.yml down

      - name: Clean up PEM files
        if: always()
        run: |
          rm -f app/private.pem
          rm -f app/public.pem
