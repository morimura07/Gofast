name: Test Go

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string

jobs:
  test-go:
    name: Test Go Code
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache Goose binary
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-goose

      - name: Setup Goose
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run Migrations
        run: goose -dir ${{ inputs.directory }}/service-core/storage/migrations postgres "user=postgres password=postgres host=localhost port=5432 dbname=postgres sslmode=disable" up

      - name: Generate PEM files
        run: |
          openssl genpkey -algorithm Ed25519 -out private.pem
          openssl pkey -in private.pem -pubout -out public.pem
          cp private.pem app/private.pem
          cp public.pem app/public.pem
          rm private.pem public.pem

      - name: Test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: go test -v ./... ./service-core/... -race -coverprofile=coverage.out -covermode=atomic
        working-directory: ${{ inputs.directory }}
